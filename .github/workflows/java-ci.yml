name: Java CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Kompilasi Semua File Java
        run: |
          mkdir -p out
          javac -d out $(find . -name "*.java")

      - name: 1a. Jalankan BilanganGenap (Simulasi NIK Ganjil 2510075 - Metode For)
        run: echo "2510075" | java -cp out BilanganGenap

      - name: 1b. Jalankan BilanganGenap (Simulasi NIK Genap 2510076 - Metode While)
        run: echo "2510076" | java -cp out BilanganGenap

      - name: 2. Jalankan LuasPersegiPanjang
        run: java -cp out LuasPersegiPanjang

      - name: 3. Jalankan hitung_nilai (Input 85)
        run: echo "85" | java -cp out hitung_nilai

      - name: 4. Jalankan Menu Utama Main.java (Simulasi Menu 1-4)
        run: printf "1\n2\n3\n92\n4\n" | java -cp out Main
